<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">请假申请状态流转</title>
  <desc id="desc">从填写申请、规则校验到负责人审批和结果通知的流程图</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1120" height="420" rx="20" fill="#f8fafc"/>
  <text x="64" y="62" fill="#0f172a" font-family="system-ui, sans-serif" font-size="26" font-weight="650">请假申请状态流转</text>
  <text x="64" y="92" fill="#64748b" font-family="system-ui, sans-serif" font-size="15">校验失败保留已填写内容；审批结果始终通知申请人</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(64 150)">
      <rect width="190" height="104" rx="12" fill="#fff" stroke="#cbd5e1"/>
      <text x="95" y="45" fill="#0f172a" font-size="18" font-weight="600">填写申请</text>
      <text x="95" y="72" fill="#64748b" font-size="14">日期、类型、原因</text>
    </g>
    <g transform="translate(336 150)">
      <rect width="190" height="104" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="95" y="45" fill="#1e3a8a" font-size="18" font-weight="600">规则校验</text>
      <text x="95" y="72" fill="#475569" font-size="14">余额与时间范围</text>
    </g>
    <g transform="translate(608 150)">
      <rect width="190" height="104" rx="12" fill="#fff" stroke="#cbd5e1"/>
      <text x="95" y="45" fill="#0f172a" font-size="18" font-weight="600">负责人审批</text>
      <text x="95" y="72" fill="#64748b" font-size="14">通过或明确驳回</text>
    </g>
    <g transform="translate(880 150)">
      <rect width="176" height="104" rx="12" fill="#f0fdf4" stroke="#86efac"/>
      <text x="88" y="45" fill="#14532d" font-size="18" font-weight="600">结果通知</text>
      <text x="88" y="72" fill="#475569" font-size="14">记录状态与操作人</text>
    </g>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M254 202 H326"/>
    <path d="M526 202 H598"/>
    <path d="M798 202 H870"/>
    <path d="M431 254 V322 H159 V264"/>
  </g>
  <text x="294" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="13">提交</text>
  <text x="566" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="13">通过</text>
  <text x="706" y="337" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">校验失败：提示原因并返回修改</text>
</svg>
